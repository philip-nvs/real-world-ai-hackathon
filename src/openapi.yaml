openapi: 3.1.0
info:
  title: Banking case agent API
  version: 0.1.0
  description: |
    Upload case folders (index.md, history.md, attachments/...) and read them back.
    A case is stored as one MongoDB document in `cases`, keyed by case id, holding every file's bytes.

    Start an agent session on a case and poll it. A session is one run of the case agent to a single
    decision (act/ask/wait/escalate), stored in `sessions`; every trace line (model turns, tool calls,
    tool results, policy-guard blocks) is stored in `session_events`.

paths:
  /health:
    get:
      summary: Liveness check
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, const: ok}
                required: [status]

  /cases:
    post:
      summary: Upload a case folder or loose files
      description: |
        Each part's filename is the file's path inside the case, e.g. `001/attachments/statement.pdf`;
        this is what a browser sends for `<input type="file" webkitdirectory>`.

        - If every file sits under one shared top folder, that folder is the case id (unless `case_id`
          is given) and is stripped from the stored paths.
        - Otherwise `case_id` is required.
        - Re-uploading an existing case id replaces the whole case; files missing from the new upload are gone.
        - The total of all files must be at most 15 MB (15728640 bytes), because the case is one Mongo document.
        - Paths that are absolute, contain `.` / `..` segments, or repeat within the upload are rejected.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  minItems: 1
                  items: {type: string, format: binary}
                  description: One part per file; the part's filename is its relative path.
                case_id:
                  type: string
                  description: Case id. Overrides the top-folder name; required for loose files.
              required: [files]
      responses:
        "201":
          description: Case stored
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CaseCreated"}
              example: {id: "001", files: [index.md, history.md, attachments/statement.pdf]}
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    get:
      summary: List cases
      responses:
        "200":
          description: Cases, sorted by id
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/CaseSummary"}

  /cases/{case_id}:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    get:
      summary: Get a case's file list (no file contents)
      responses:
        "200":
          description: The case
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Case"}
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete a case
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"

  /cases/{case_id}/files/{path}:
    parameters:
      - $ref: "#/components/parameters/CaseId"
      - name: path
        in: path
        required: true
        description: File path inside the case, as listed by `GET /cases/{case_id}`. May contain `/` (e.g. `attachments/statement.pdf`), sent unescaped.
        schema: {type: string}
    get:
      summary: Download one file's raw bytes
      responses:
        "200":
          description: File contents, served with the content type recorded at upload
          content:
            "*/*":
              schema: {type: string, format: binary}
        "404":
          $ref: "#/components/responses/Error"

  /cases/{case_id}/sessions:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    post:
      summary: Start an agent session on a case
      description: |
        Queues a one-shot run of the case agent on the stored case and returns at once.
        The agent's tools answer from the case's `bank_env` fixture when one exists (case `017-event-004`
        uses fixture `017` and sees only its own events), otherwise from `tools.py`, which records each
        action without executing it. Poll `GET /sessions/{session_id}` until `status` is `done` or `failed`.
      responses:
        "202":
          description: Session queued
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "404":
          $ref: "#/components/responses/Error"
    get:
      summary: List a case's sessions, newest first
      responses:
        "200":
          description: Sessions, with only id, case_id, status, timestamps, decision.decision and crashed
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Session"}

  /sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      summary: Get a session's status and result
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "404":
          $ref: "#/components/responses/Error"

  /sessions/{session_id}/events:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - name: after
        in: query
        description: Return only events with `seq` greater than this; pass the last `seq` you have. Default -1 (all).
        schema: {type: integer, default: -1}
    get:
      summary: Get a session's trace, in order
      responses:
        "200":
          description: Trace lines with seq > after
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/SessionEvent"}
        "404":
          $ref: "#/components/responses/Error"

  /export:
    get:
      summary: Download the answers for some cases as a zip
      description: |
        For each `case_id`, the newest session's ANSWER.md and REASONING.md, stored as
        `<case_id>/ANSWER.md` and `<case_id>/REASONING.md` (the same layout as `run.py --out`).
        Cases whose newest session is not `done` are left out. `/`, `\` and leading dots in a case id are replaced or stripped
        so every entry stays inside the zip.
      parameters:
        - name: case_id
          in: query
          required: true
          style: form
          explode: true
          description: Repeat for each case, e.g. `?case_id=001&case_id=002`.
          schema:
            type: array
            items: {type: string}
      responses:
        "200":
          description: ANSWERS.zip
          content:
            application/zip:
              schema: {type: string, format: binary}
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

components:
  parameters:
    CaseId:
      name: case_id
      in: path
      required: true
      schema: {type: string}

    SessionId:
      name: session_id
      in: path
      required: true
      schema: {type: string}

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                description: A message, or FastAPI's list of validation errors for a malformed request.
                oneOf:
                  - type: string
                  - type: array
                    items: {type: object}
            required: [detail]

  schemas:
    CaseCreated:
      type: object
      properties:
        id: {type: string}
        files:
          type: array
          items: {type: string}
          description: Stored paths, in upload order.
      required: [id, files]

    CaseSummary:
      type: object
      properties:
        id: {type: string}
        uploaded_at: {type: string, format: date-time}
      required: [id, uploaded_at]

    Case:
      type: object
      properties:
        id: {type: string}
        uploaded_at: {type: string, format: date-time}
        files:
          type: array
          items: {$ref: "#/components/schemas/FileMeta"}
      required: [id, uploaded_at, files]

    FileMeta:
      type: object
      properties:
        path: {type: string, examples: [attachments/statement.pdf]}
        size: {type: integer, description: Bytes}
        content_type: {type: string, examples: [application/pdf]}
      required: [path, size, content_type]

    Session:
      type: object
      properties:
        id: {type: string}
        case_id: {type: string}
        status:
          type: string
          enum: [queued, running, done, failed]
          description: |
            `done` includes an agent crash (`crashed: true`), which still ends in the Escalate fallback decision.
            `failed` means the run itself broke or the server stopped mid-run; see `error`.
        created_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        decision:
          type: object
          description: The agent's submit_decision input (decision, next_action, evidence, conflicts, customer_message, handover, rejected_options, final_result).
        crashed: {type: boolean}
        blocked: {type: integer, description: Policy-guard blocks during the run}
        tokens:
          type: array
          items: {type: integer}
          description: "[input tokens, output tokens]"
        bank: {type: string, enum: [fixture, mock], description: Which tools answered}
        bank_log: {type: array, items: {type: object}, description: Every fixture call and its outcome; empty for mock}
        answer_md: {type: string, description: The run's ANSWER.md}
        reasoning_md: {type: string, description: The run's REASONING.md}
        error: {type: string, description: Set when status is failed}
      required: [id, case_id, status, created_at]

    SessionEvent:
      type: object
      description: One trace.jsonl line plus its position; the other fields depend on kind.
      properties:
        seq: {type: integer}
        t: {type: number, description: Unix time}
        kind: {type: string, enum: [loaded, model, tool_call, tool_result, tool_error, guard_block, crash, decision]}
      required: [seq, t, kind]
      additionalProperties: true
